site_name: worldarray
site_description: Chunked arrays in world coordinates, through tensorstore.
site_url: https://janeliascicomp.github.io/worldarray/
repo_url: https://github.com/JaneliaSciComp/worldarray
repo_name: worldarray
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/brightness-7, name: dark mode }
    - scheme: slate
      primary: teal
      toggle: { icon: material/brightness-4, name: light mode }

nav:
  - Home: index.md
  - Specification: spec.md
  - Changelog: changelog.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
